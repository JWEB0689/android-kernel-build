name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Trigger Universal Builder
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: universal-kernel-builder.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          inputs: '{ "device": "edgeplus", "defconfig": "vendor/edgeplus_defconfig", "arch": "arm64", "ksu_enabled": "true", "susfs_enabled": "true" }'

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}